name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./DigitalMarketingCampaignService
          file: ./DigitalMarketingCampaignService/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/digital-marketing-campaign-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./DigitalMarketingCampaignService-frontend
          file: ./DigitalMarketingCampaignService-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/digital-marketing-campaign-frontend:latest
